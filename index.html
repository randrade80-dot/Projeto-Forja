<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>PROJETO FORJA</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0b0c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
*{box-sizing:border-box}
:root{--bg:#0b0b0c;--cd:#17181a;--ln:#2b2d30;--li:#c6ff00;--mu:#9a9ea4;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:#fff;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{color:var(--li);letter-spacing:2px}
main{max-width:900px;margin:auto;padding:14px 14px 100px;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{margin:6px 0 10px;font-size:19px}h3{margin:14px 0 6px;font-size:15px;color:var(--li)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.g>.card{margin:0}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.big{font-size:24px;font-weight:700;color:var(--li)}.mu{color:var(--mu);font-size:13px}.er{color:#ff6b6b;min-height:1em;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.r2{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}.r2 select{flex:1;min-width:120px}
input,select,textarea{background:#0f1011;color:#fff;border:1px solid var(--ln);border-radius:9px;padding:8px;font:inherit;max-width:100%}
input[type=number]{width:78px}input[type=text],textarea{width:100%}
button{background:var(--li);color:#000;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
button.gh{background:transparent;color:var(--li);border:1px solid var(--li)}button.dn{background:#3a1515;color:#ff8a8a}
.bt{height:8px;background:#26282b;border-radius:9px;overflow:hidden}.bt i{display:block;height:100%;background:var(--li)}.bw{margin:7px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;border-bottom:1px solid var(--ln);text-align:left}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101112;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:11px}nav button.on{color:var(--li);border-top:2px solid var(--li)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal button{background:#0f1011;color:#fff;font-weight:400;padding:6px 0;border:1px solid var(--ln)}.cal button.s{border-color:var(--li);color:var(--li)}
.ph{position:relative;aspect-ratio:3/4;background:#000;border-radius:10px;overflow:hidden;max-width:360px;margin:auto}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.th{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.hero{border-left:3px solid var(--li);padding:6px 12px;margin-bottom:12px}
@media print{header,nav,.np{display:none}body,:root{background:#fff;color:#000}.card{background:#fff;color:#000;border-color:#ccc}}
</style></head><body>

/* IndexedDB */
const openDB=()=>new Promise(r=>{try{const q=indexedDB.open('forja',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const getAll=()=>new Promise(r=>{const o={};if(!db)return r(o);try{const c=db.transaction('kv').objectStore('kv').openCursor();c.onsuccess=()=>{const x=c.result;if(x){o[x.key]=x.value;x.continue()}else r(o)};c.onerror=()=>r(o)}catch(e){r(o)}});
const save=k=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S[k],k)}catch(e){}};
/* cálculos */
const fo=id=>S.foods.find(f=>f.id==id)||{k:0,p:0,c:0,g:0};
const calc=it=>{const f=fo(it[0]),q=+it[1]||0;return{k:f.k*q/100,p:f.p*q/100,c:f.c*q/100,g:f.g*q/100}};
const sum=a=>a.reduce((t,x)=>({k:t.k+x.k,p:t.p+x.p,c:t.c+x.c,g:t.g+x.g}),{k:0,p:0,c:0,g:0});
const tot1=i=>sum(i.map(calc)),tot=m=>sum(m.map(s=>tot1(s.it)));
const dm=()=>S.meals[D]||JSON.parse(JSON.stringify(S.tpl));
const sMs=()=>[...S.ms].sort((a,b)=>a.date<b.date?-1:1);
const did=dt=>S.wk[dt]&&Object.values(S.wk[dt].ex).some(e=>e.s.some(x=>x.k||x.r));
const wkDates=()=>{const d=new Date(D+'T12:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})};

function pd(id){for(const k in S.plan)S.plan[k]=S.plan[k].filter(e=>e.id!=id);save('plan');render()}
function pa(wd){const n=$('#xn').value.trim(),s=Math.round(+$('#xs').value),r=$('#xr').value.trim();if(!n||!(s>=1&&s<=10)||!r)return er('Informe nome, séries (1 a 10) e repetições.');(S.plan[wd]=S.plan[wd]||[]).push({id:uid(),n,s,r});save('plan');render()}
const setDay=fn=>{const m=dm();fn(m);S.meals[D]=m;save('meals');render()};
const fi=(i,j,v)=>setDay(m=>m[i].it[j][0]=v),fq=(i,j,v)=>setDay(m=>m[i].it[j][1]=Math.max(0,+v||0)),fr=(i,j)=>setDay(m=>m[i].it.splice(j,1)),fa=i=>setDay(m=>m[i].it.push([S.foods[0]?.id,100]));
const fe=(id,k,v)=>{const f=S.foods.find(x=>x.id==id);f[k]=(k=='n'||k=='st')?(v.trim()||f[k]):Math.max(0,+v||0);save('foods');render()};
function fn(){const n=$('#nn').value.trim(),v=['nk','np','nc','ng'].map(i=>+$('#'+i).value);if(!n||v.some(x=>!(x>=0))||!$('#nk').value)return er('Informe o nome e os valores por 100 g.');S.foods.push(FD(uid(),n,$('#ns').value.trim()||'pronto',...v));save('foods');render()}
function addM(){const o={date:$('#md').value||D};let n=0;for(const[k,l,lo,hi]of MF){const v=$('#m_'+k).value;if(v!==''){const x=+v;if(!(x>=lo&&x<=hi))return er(l+': valor fora do intervalo ('+lo+' a '+hi+').');o[k]=x;n++}}if(!n)return er('Preencha ao menos uma medida.');const i=S.ms.findIndex(x=>x.date==o.date);if(i>=0)Object.assign(S.ms[i],o);else S.ms.push(o);save('ms');render()}
function addP(){const f=$('#pf').files[0];if(!f)return er('Escolha uma foto.');const r=new FileReader();r.onload=()=>{S.ph.push({id:uid(),date:$('#pd').value||D,t:$('#pt').value,src:r.result});save('ph');render()};r.readAsDataURL(f)}
const mn=(k,v)=>{(S.notes[MO]=S.notes[MO]||{})[k]=v;save('notes')},gs=(k,v)=>{S.goals[k]=v;save('goals')};
function exp(){const s=JSON.stringify({app:'forja',v:1,data:S}),t=$('#ex');t.value=s;t.style.display='block';try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='forja-backup-'+TODAY+'.json';a.click()}catch(e){}er('Se o download não iniciar, copie o texto abaixo e guarde em um arquivo .json.')}
function impF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o.data||o;if(!d.plan||!d.foods)throw 0;S=Object.assign(defaults(),d);Object.keys(S).forEach(save);render();er('Backup importado.')}catch(e){er('Arquivo de backup inválido.')}};r.readAsText(f)}
function wipe(){if($('#wp').value!='APAGAR')return er('Digite APAGAR para confirmar.');try{db.transaction('kv','readwrite').objectStore('kv').clear()}catch(e){}S=defaults();Object.keys(S).forEach(save);render()}
(async()=>{await openDB();const st=await getAll(),d=defaults();S={};for(const k in d){S[k]=st[k]??d[k];if(st[k]==null)save(k)}
$('#nv').innerHTML=[['home','Início'],['train','Treino'],['food','Comida'],['meas','Medidas'],['photo','Fotos'],['month','Mês'],['more','Mais']].map(a=>`<button data-v=${a[0]} onclick="go('${a[0]}')">${a[1]}</button>`).join('');render()})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
